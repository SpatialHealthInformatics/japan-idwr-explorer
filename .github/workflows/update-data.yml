# Maintained by SpatialHealthInformatics
name: Update IDWR data

on:
  schedule:
    - cron: "17 3 * * *"      # every day, 03:17 UTC (12:17 JST)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Download, check and rewrite data/idwr_weekly.csv
        id: upd
        run: |
          python tools/update_idwr_data.py | tee out.txt
          echo "through=$(grep '^DATA_THROUGH' out.txt | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/idwr_weekly.csv; then
            echo "No change."
          else
            git config user.name "PublicHealthInformatics"
            git config user.email "193877325+PublicHealthInformatics@users.noreply.github.com"
            git add data/idwr_weekly.csv
            git commit -m "Update IDWR data through ${{ steps.upd.outputs.through }}"
            git push
          fi
